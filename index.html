<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GLSL Shader Demo</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			width: 100%;
			height: 100%;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			overflow: hidden;
			background: #000;
		}

		#sketch-container {
			width: 100%;
			height: 100%;
			display: block;
		}

		#sketch-gui {
			position: absolute;
			top: 20px;
			left: 20px;
			z-index: 100;
		}

		canvas {
			display: block;
		}
	</style>
</head>
<body>
	<div id="sketch-container"></div>
	<div id="sketch-gui"></div>

	<!-- Everything is self-contained in this single file -->
	<script src="three.js"></script>
	<script src="main.js"></script>
</body>
</html>
